name: tetrail

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${TETRAIL_POSTGRES_USER:-tetrail}
      POSTGRES_PASSWORD: ${TETRAIL_POSTGRES_PASSWORD:-tetrail-local-only}
      POSTGRES_DB: ${TETRAIL_POSTGRES_DB:-tetrail}
    ports: ["${TETRAIL_POSTGRES_PORT:-5432}:5432"]
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
      - "../../services/catalog/Migrations/001_trip_search.sql:/docker-entrypoint-initdb.d/010-catalog-trip-search.sql:ro"
      - "../../services/catalog/Migrations/002_development_seed.sql:/docker-entrypoint-initdb.d/020-catalog-development-seed.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${TETRAIL_REDIS_PORT:-6379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${TETRAIL_KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
    ports: ["${TETRAIL_KAFKA_PORT:-9092}:9092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${TETRAIL_MINIO_ROOT_USER:-tetrail}
      MINIO_ROOT_PASSWORD: ${TETRAIL_MINIO_ROOT_PASSWORD:-tetrail-local-only}
    ports:
      - "${TETRAIL_MINIO_API_PORT:-9000}:9000"
      - "${TETRAIL_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
